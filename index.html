<!DOCTYPE html>
<html lang="id">

<meta charset="UTF-8">

<title>evolution is my revolution - Login Portal</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

/* VIDEO */
video#bg-video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

/* OVERLAY */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

}

/* KONTEN */
.content{

color:white;
}

h1{
font-size:2em;
margin-bottom:25px;

}

form{

gap:12px;
}

input{

padding:12px;

text-align:center;
outline:none;
}

button{
width:100%;
padding:12px;
background:#00ff00;
color:black;
border:none;
border-radius:6px;
font-size:1em;
cursor:pointer;
}

button:hover{
background:#00cc00;
box-shadow:0 0 12px #00ff00;
}

</head>

<body>

max-width:220px;

autocomplete="off">

<br><br>

<button
type="button"

max-width:220px;

max-width:220px;

onclick="verifyOTP()">
VERIFIKASI OTP

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.loginSuccess = async function(event){

event.preventDefault();

const email = event.target.email.value.trim();
const password = event.target.password.value.trim();

try{

const userCred = await signInWithEmailAndPassword(auth, email, password);

const user = userCred.user;

// 🔥 CEK EMAIL VERIFIED
if(!user.emailVerified){

await sendEmailVerification(user);

alert("Email belum diverifikasi. Link verifikasi sudah dikirim ke email kamu.");

return;

}

// ✔ LOGIN BERHASIL
alert("Login berhasil");
window.location.href = "progar.html";

}
catch(e){
alert(e.code + "\n" + e.message);

};
