<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>evolution is my revolution - Login Portal</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

/* VIDEO */
video#bg-video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

/* OVERLAY */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.55);
z-index:-1;
}

/* KONTEN */
.content{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:90%;
max-width:450px;
text-align:center;
font-family:Courier New;
color:white;
}

h1{
font-size:2em;
margin-bottom:25px;
text-shadow:0 0 8px #00ff00;
line-height:.5;
}

form{
display:flex;
flex-direction:column;
gap:12px;
}

input{
width:100%;
padding:12px;
border:1px solid #00ff00;
border-radius:6px;
background:rgba(0,0,0,.3);
color:white;
font-size:1em;
text-align:center;
outline:none;
}

button{
width:100%;
padding:12px;
background:#00ff00;
color:black;
border:none;
border-radius:6px;
font-size:1em;
cursor:pointer;
}

button:hover{
background:#00cc00;
box-shadow:0 0 12px #00ff00;
}
</style>
</head>

<body>

<!-- VIDEO -->
<video id="bg-video" autoplay muted loop playsinline>
<source src="Desain tanpa judul (2).mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- AUDIO -->
<audio autoplay loop>
<source src="Helloween-Forever-And-One-Neverland.aac" type="audio/mpeg">
</audio>

<!-- LOGIN -->
<div class="content">

<h1>PROGAR</h1>
<h1>PUSLAT KODIKLATAU</h1>

<form onsubmit="return loginSuccess(event)">

<input type="email" name="email" placeholder="Email" required autocomplete="off">

<input type="password" name="password" placeholder="Password" required autocomplete="off">

<button type="submit">LOGIN</button>

</form>

<!-- OTP SECTION (HIDDEN) -->
<div id="otp-section" style="display:none; margin-top:15px; text-align:center;">

<div id="recaptcha-container" style="margin:10px auto;"></div>

<input
style="
padding:8px;
font-size:0.9em;
width:80%;
max-width:220px;
"
type="text"
id="phone"
placeholder="+628211747988"
autocomplete="off">

<br><br>

<button
type="button"
style="
padding:8px 12px;
font-size:0.85em;
width:80%;
max-width:220px;
"
onclick="sendOTP()">
KIRIM OTP
</button>

<br><br>

<input
style="
padding:8px;
font-size:0.9em;
width:80%;
max-width:220px;
"
type="text"
id="otp"
placeholder="Kode OTP"
autocomplete="off">

<br><br>

<button
type="button"
style="
padding:8px 12px;
font-size:0.85em;
width:80%;
max-width:220px;
"
onclick="verifyOTP()">
VERIFIKASI OTP
</button>

</div>

</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
RecaptchaVerifier,
signInWithPhoneNumber
} 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC7SkdwaJjl6pzXehN6zpeycNfTZ5HFXP4",
  authDomain: "portalmonitoring-a0926.firebaseapp.com",
  databaseURL: "https://portalmonitoring-a0926-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "portalmonitoring-a0926",
  storageBucket: "portalmonitoring-a0926.firebasestorage.app",
  messagingSenderId: "277567382328",
  appId: "1:277567382328:web:010277cc1eb9b7cdfa97cd",
  measurementId: "G-ENM8FDGX6E"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let confirmationResult;

// LOGIN EMAIL + PASSWORD
window.loginSuccess = async function(event){

event.preventDefault();

const email = event.target.email.value.trim();
const password = event.target.password.value.trim();

try{

await signInWithEmailAndPassword(auth, email, password);

// tampilkan OTP
document.getElementById("otp-section").style.display = "block";

alert("Login sukses! lanjut verifikasi OTP");

document.getElementById("otp-section")
.scrollIntoView({behavior:"smooth"});

}
catch(e){
alert(e.message);
}

return false;
};

// KIRIM OTP
window.sendOTP = function(){

const phoneNumber = document.getElementById("phone").value;

window.recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", {
size: "normal"
});

recaptchaVerifier.render();

signInWithPhoneNumber(auth, phoneNumber, window.recaptchaVerifier)
.then((result) => {
confirmationResult = result;
alert("OTP terkirim");
})
.catch((err) => {
alert(err.code + "\n" + err.message);
});

};

// VERIFIKASI OTP
window.verifyOTP = function(){

const code =
document.getElementById("otp").value;

confirmationResult.confirm(code)
.then((result) => {

alert("LOGIN BERHASIL (EMAIL + OTP)");

window.location.href = "progar.html";

})
.catch((err) => {
alert("OTP salah / expired");
});

};

</script>

</body>
</html>
